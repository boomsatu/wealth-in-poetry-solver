[package]
name = "revolution_solver"
version = "0.1.0"
edition = "2021"

[dependencies]
rayon = "1.10"
sha2 = "0.10"
hmac = "0.12"
ripemd = "0.1"
pbkdf2 = "0.12"
k256 = { version = "0.13", default-features = false, features = ["arithmetic", "ecdsa"] }
clap = { version = "4.5", features = ["derive"] }
indicatif = { version = "0.17", features = ["rayon"] }
hex = "0.4"
bs58 = "0.5"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
